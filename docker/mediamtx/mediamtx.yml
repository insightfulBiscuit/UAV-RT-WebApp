# MediaMTX config for the UAV-RT stack.
#
# Ingest:  RTMP on :1935/live/{streamKey}
# Playback: WHEP on :8889/live/{streamKey}/whep
# Playback: HLS  on :8888/live/{streamKey}/index.m3u8  (fallback + recording)
#
# The streamKey is composed by the backend as `{sn}_{cameraIndex}` — see
# server/src/livestreamService.ts `streamKeyFor`.

logLevel: info

# --- RTMP ingest (what FH2 → dock pushes to) ---
rtmp: yes
rtmpAddress: :1935
rtmpEncryption: "no"

# --- WHEP playback (what the browser plays) ---
webrtc: yes
webrtcAddress: :8889
webrtcAllowOrigin: '*'
webrtcTrackGatherTimeout: 2s
webrtcICEServers2:
  - url: stun:stun.l.google.com:19302
# Pin the ICE candidates advertised to browsers on the same host. On Windows
# in particular, MediaMTX's auto-detection sometimes picks up vEthernet /
# WSL / Hyper-V / VPN interfaces whose IPs the browser cannot reach — after
# 5-7 seconds of ICE consent-freshness checks failing on those candidates,
# the peer drops to "disconnected" and the video freezes. Pinning to
# 127.0.0.1 avoids that whole class of failure for localhost dev.
webrtcAdditionalHosts: [127.0.0.1]

# --- HLS fallback (2-5 s latency, universal player) ---
hls: yes
hlsAddress: :8888
hlsAllowOrigin: '*'
hlsVariant: lowLatency

# --- API (used by the backend for stream inventory + health) ---
api: yes
apiAddress: :9997

# --- Path defaults ---
# Anything under `live/` is accepted with any streamKey. Auth/ACL can be
# tightened once we know FH2's push-side credentials.
paths:
  # Akamai relay pulls. Local MediaMTX pulls from the operator's own VM
  # (172.232.174.165) on demand — only when a browser subscribes to WHEP —
  # so we don't hold a permanent connection when nothing's watching.
  # Reader credentials are baked into the source URLs.
  m400:
    source: rtmp://172.232.174.165:1935/live/m400?user=uavrt_all_read&pass=88f3908355cd5ec0bf0c518fe8ec350b9e48056642cdba8e
    sourceOnDemand: yes
    sourceOnDemandStartTimeout: 10s
    sourceOnDemandCloseAfter: 10s
  m4td_wide:
    source: rtmp://172.232.174.165:1935/live/m4td_wide?user=uavrt_all_read&pass=88f3908355cd5ec0bf0c518fe8ec350b9e48056642cdba8e
    sourceOnDemand: yes
    sourceOnDemandStartTimeout: 10s
    sourceOnDemandCloseAfter: 10s
  m4td_zoom:
    source: rtmp://172.232.174.165:1935/live/m4td_zoom?user=uavrt_all_read&pass=88f3908355cd5ec0bf0c518fe8ec350b9e48056642cdba8e
    sourceOnDemand: yes
    sourceOnDemandStartTimeout: 10s
    sourceOnDemandCloseAfter: 10s
  m4td_thermal:
    source: rtmp://172.232.174.165:1935/live/m4td_thermal?user=uavrt_all_read&pass=88f3908355cd5ec0bf0c518fe8ec350b9e48056642cdba8e
    sourceOnDemand: yes
    sourceOnDemandStartTimeout: 10s
    sourceOnDemandCloseAfter: 10s
  dock3_indoor:
    source: rtmp://172.232.174.165:1935/live/dock3_indoor?user=uavrt_all_read&pass=88f3908355cd5ec0bf0c518fe8ec350b9e48056642cdba8e
    sourceOnDemand: yes
    sourceOnDemandStartTimeout: 10s
    sourceOnDemandCloseAfter: 10s

  # Catch-all for local direct publishers (e.g. rtmp-e2e loopback tests).
  all_others:
    source: publisher
    sourceOnDemand: no
